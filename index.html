<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Race Results</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2430;--muted:#6b7585;--line:#dde2e8;--gold:#c99a06;--silver:#8b949e;--bronze:#b5651d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
header a{color:#fff;font-size:14px}
main{max-width:860px;margin:0 auto;padding:20px}
.intro{color:var(--muted);font-size:14px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 4px}
.date{color:var(--muted);font-size:14px;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-size:16px}
tr:last-child td{border-bottom:0}
.place{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--muted)}
.p1{background:var(--gold)!important}
.p2{background:var(--silver)!important}
.p3{background:var(--bronze)!important}
.bib{background:var(--ink);color:#fff;border-radius:6px;padding:3px 8px;font-weight:700;font-size:14px}
.time{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.dnf{color:var(--muted);font-size:14px;margin:12px 0 0}
.empty{color:var(--muted);font-size:15px;padding:12px 0}
</style>
</head>
<body>
<header>
  <h1>Family Race Results</h1>
  <a href="timer.html">Timekeeper page</a>
</header>

<main>
  <p class="intro">Finished races. A race appears here once the timekeeper publishes it. Races still in progress are only visible through their live link.</p>
  <div id="races"><p class="empty">Loading races...</p></div>
</main>

<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // ms -> "m:ss.t" (or "h:mm:ss.t" past an hour)
  function fmt(ms) {
    var tenths = Math.floor(ms / 100);
    var t = tenths % 10;
    var totalSec = Math.floor(tenths / 10);
    var s = totalSec % 60;
    var m = Math.floor(totalSec / 60) % 60;
    var h = Math.floor(totalSec / 3600);
    return h ? h + ':' + pad(m) + ':' + pad(s) + '.' + t : m + ':' + pad(s) + '.' + t;
  }
  function dateText(ms) {
    if (!ms) return '';
    return new Date(ms).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderRace(race) {
    var rows = race.finished.map(function (r) {
      var cls = r.place <= 3 ? ' p' + r.place : '';
      return '<tr>' +
        '<td style="width:60px"><span class="place' + cls + '">' + r.place + '</span></td>' +
        '<td style="width:70px"><span class="bib">#' + esc(r.bib) + '</span></td>' +
        '<td>' + esc(r.name) + '</td>' +
        '<td class="time">' + fmt(r.ms) + '</td>' +
        '</tr>';
    }).join('');

    var dnf = race.dnf && race.dnf.length
      ? '<p class="dnf">Did not finish: ' + race.dnf.map(function (r) {
          return esc(r.name) + ' (#' + esc(r.bib) + ')';
        }).join(', ') + '</p>'
      : '';

    return '<section class="card">' +
      '<h2>' + esc(race.name) + '</h2>' +
      '<p class="date">' + esc(dateText(race.startedAt || race.publishedAt)) + '</p>' +
      (rows ? '<table>' + rows + '</table>' : '<p class="empty">No finishers.</p>') +
      dnf +
      '</section>';
  }

  fetch('/.netlify/functions/results', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('Could not load results');
      return res.json();
    })
    .then(function (data) {
      var races = data.races || [];
      $('races').innerHTML = races.length
        ? races.map(renderRace).join('')
        : '<p class="empty">No published races yet.</p>';
    })
    .catch(function () {
      $('races').innerHTML = '<p class="empty">Could not load results. Try refreshing the page.</p>';
    });

  function $(id) { return document.getElementById(id); }
})();
</script>
</body>
</html>
